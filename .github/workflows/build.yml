# Tests à chaque push / pull request.
# Pour publier une version : mettre VERSION à jour dans archive.py et CHANGELOG.md, puis
#   git tag v2.1.0 && git push origin v2.1.0
# La CI construit alors l'exe, le zip portable et l'installateur, et crée la release GitHub
# que la mise à jour automatique du programme télécharge.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Tests
        run: python -m unittest -v test_archive

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Vérifier que le tag correspond à VERSION
        shell: pwsh
        run: |
          $v = python -c "import archive; print(archive.VERSION)"
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} différent de VERSION=$v (archive.py)" }

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Construire (exe, zip, installateur, empreintes)
        shell: cmd
        run: build_exe.bat

      - name: Notes de version (extraites de CHANGELOG.md)
        shell: pwsh
        run: |
          python -c "import re,sys; v=sys.argv[1].lstrip('v'); t=open('CHANGELOG.md',encoding='utf-8').read(); m=re.search(r'^## \[?'+re.escape(v)+r'\]?[^\n]*\n(.*?)(?=^## |\Z)', t, re.S|re.M); open('notes.md','w',encoding='utf-8').write(m.group(1).strip() if m else '')" "${{ github.ref_name }}"

      - name: Publier la release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" --title "Archive Familiale ${{ github.ref_name }}" --notes-file notes.md `
            dist/ArchiveFamiliale-Setup.exe dist/ArchiveFamiliale-Setup.exe.sha256 `
            dist/ArchiveFamiliale.zip dist/ArchiveFamiliale.zip.sha256
